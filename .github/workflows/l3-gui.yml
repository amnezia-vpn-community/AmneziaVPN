name: L3 GUI Tests (Nightly)
on:
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/l3-gui.yml'

jobs:
  l3-gui:
    name: l3-gui (${{ matrix.distro }})
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    strategy:
      matrix:
        include:
          - distro: ubuntu
            image: ghcr.io/amnezia-vpn-community/linux-runner:latest
          - distro: debian
            image: ghcr.io/amnezia-vpn-community/debian-runner:latest
    container:
      image: ${{ matrix.image }}
      credentials:
        username: amneziabot
        password: ${{ secrets.GHCR_PAT }}
      options: >-
        --cap-add NET_ADMIN
        --device /dev/net/tun

    steps:
      - name: Checkout test-suites
        uses: actions/checkout@v4
        with:
          repository: amnezia-vpn-community/test-suites
          token: ${{ secrets.GHCR_PAT }}
          path: test-suites

      - name: Install test dependencies
        run: pip install -q -e test-suites/

      - name: Download AmneziaVPN installer
        run: |
          curl -fsSL -o AmneziaVPN_linux.tar \
            "https://github.com/amnezia-vpn/amnezia-client/releases/download/4.8.15.4/AmneziaVPN_4.8.15.4_linux_x64.tar"
          mkdir -p amnezia_bin && tar xf AmneziaVPN_linux.tar -C amnezia_bin
          BIN=$(find amnezia_bin -name "*.bin" | head -1)
          chmod +x "$BIN" && mv "$BIN" /tmp/AmneziaVPN.bin
          echo "AMNEZIA_BIN=/tmp/AmneziaVPN.bin" >> $GITHUB_ENV

      - name: Run L3 GUI tests
        run: |
          pytest test-suites/src/amnezia_tests/suites/l3_gui/ \
            -v --tb=short \
            --junitxml=/tmp/l3-results.xml \
            -o junit_family=xunit2 \
            --reruns 1 \
            --reruns-delay 5

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l3-gui-results-${{ matrix.distro }}
          path: |
            /tmp/l3-results.xml
            /tmp/amnezia-artifacts/

      # Parse test results for PR comment
      - name: Parse test results for PR comment
        if: always() && github.event_name == 'pull_request'
        run: |
          python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET, sys

          xml_path = '/tmp/l3-results.xml'
          suite_marker = 'l3-gui'
          suite_name = 'L3 GUI'
          distro = '${{ matrix.distro }}'

          try:
              tree = ET.parse(xml_path)
              root = tree.getroot()
              suites = list(root) if root.tag == 'testsuites' else [root]

              total = failures = errors = skipped = 0
              time_total = 0.0
              failed_tests = []

              for suite in suites:
                  total    += int(suite.get('tests',    0))
                  failures += int(suite.get('failures', 0))
                  errors   += int(suite.get('errors',   0))
                  skipped  += int(suite.get('skipped',  0))
                  time_total += float(suite.get('time', 0) or 0)
                  for tc in suite.findall('testcase'):
                      if tc.find('failure') is not None or tc.find('error') is not None:
                          failed_tests.append(
                              f"`{tc.get('classname', '')}::{tc.get('name', '')}`"
                          )

              passed = total - failures - errors - skipped
              total_failures = failures + errors
              status_emoji = '✅' if total_failures == 0 else '❌'

              lines = [
                  f'<!-- amnezia-test-results-{suite_marker}-{distro} -->',
                  f'## {status_emoji} {suite_name} Results ({distro})',
                  '',
                  '| Metric | Value |',
                  '|--------|-------|',
                  f'| ✅ Passed | {passed} |',
                  f'| ❌ Failed | {total_failures} |',
                  f'| ⏭️ Skipped | {skipped} |',
                  f'| Total | {total} |',
                  f'| ⏱️ Duration | {time_total:.1f}s |',
              ]

              if failed_tests:
                  lines.append('')
                  lines.append('### Failed Tests')
                  for t in failed_tests[:20]:
                      lines.append(f'- {t}')
                  if len(failed_tests) > 20:
                      lines.append(f'- ... and {len(failed_tests) - 20} more')

              comment_body = '\n'.join(lines)
          except Exception as e:
              comment_body = (
                  f'<!-- amnezia-test-results-{suite_marker}-{distro} -->\n'
                  f'⚠️ Could not parse test results ({distro}): {e}'
              )

          with open('/tmp/pr-comment.txt', 'w') as f:
              f.write(comment_body)

          print("PR comment prepared.")
          PYEOF

      # Post test results comment on PR
      - name: Post test results comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const distro = '${{ matrix.distro }}';
            const marker = `<!-- amnezia-test-results-l3-gui-${distro} -->`;
            const body = fs.readFileSync('/tmp/pr-comment.txt', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
              console.log(`Updated existing comment ${existing.id}`);
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
              console.log(`Created new comment ${created.id}`);
            }

      - name: Notify orchestrator
        if: always()
        env:
          ORCH_URL: https://104-248-29-142.sslip.io
          ORCH_USER: ${{ secrets.ORCH_ADMIN_USERNAME }}
          ORCH_PASS: ${{ secrets.ORCH_ADMIN_PASSWORD }}
        run: |
          STATUS=$([ "${{ job.status }}" = "success" ] && echo "passed" || echo "failed")
          curl -sf -u "$ORCH_USER:$ORCH_PASS" \
            -X POST "$ORCH_URL/api/v1/runs" \
            -H "Content-Type: application/json" \
            -d "{\"suite\":\"l3_gui\",\"distro\":\"${{ matrix.distro }}\",\"status\":\"$STATUS\",\"commit\":\"${{ github.sha }}\"}" || true
