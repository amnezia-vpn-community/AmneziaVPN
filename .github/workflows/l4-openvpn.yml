name: L4 OpenVPN Performance Tests

# Phase 8: protocol expansion of L4 perf suite (throughput + latency) to OpenVPN.
#
# Runs inside linux-runner (openvpn + iperf3 pre-installed). Requires
# NET_ADMIN + /dev/net/tun for tun0. Manual-only by default; the weekly
# l4-performance.yml WG run already saturates the iperf3 server.

on:
  workflow_dispatch:
  schedule:
    # Weekly, 30 min after the WG L4 run finishes (Sundays 03:30 UTC).
    - cron: '30 3 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l4-openvpn:
    name: L4 OpenVPN Performance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    container:
      image: ghcr.io/amnezia-vpn-community/linux-runner:latest
      credentials:
        username: amneziabot
        password: ${{ secrets.GHCR_PAT }}
      options: "--cap-add NET_ADMIN --device /dev/net/tun"

    steps:
      - name: Checkout AmneziaVPN
        uses: actions/checkout@v4

      - name: Checkout test-suites
        uses: actions/checkout@v4
        with:
          repository: amnezia-vpn-community/test-suites
          token: ${{ secrets.GHCR_PAT }}
          path: test-suites

      - name: Install test dependencies
        run: pip install -e ./test-suites -q

      - name: Install iptables (openvpn routing)
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y -qq iptables iproute2 2>&1 | tail -3

      - name: Run L4 OpenVPN performance tests
        shell: bash
        env:
          OVPN_CONFIG_B64: ${{ secrets.OVPN_CONFIG_B64 }}
          OVPN_SERVER_TUN_IP: 10.10.0.1
        run: |
          set -euxo pipefail
          pytest ./test-suites/src/amnezia_tests/suites/l4_performance/test_openvpn_performance.py \
            -v -s \
            --junit-xml=l4-openvpn-results.xml \
            --tb=short \
            --reruns 1 \
            --reruns-delay 5

      - name: Dump openvpn log on failure
        if: failure()
        continue-on-error: true
        run: |
          [ -f /tmp/openvpn-l4.log ] && tail -200 /tmp/openvpn-l4.log || echo '(no openvpn log)'

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l4-openvpn-results
          path: l4-openvpn-results.xml

      - name: Notify orchestrator
        if: always()
        continue-on-error: true
        env:
          ORCH_USER: ${{ secrets.ORCH_ADMIN_USERNAME }}
          ORCH_PASS: ${{ secrets.ORCH_ADMIN_PASSWORD }}
        run: |
          STATUS=$([ "${{ job.status }}" = "success" ] && echo "passed" || echo "failed")
          curl -sf -X POST https://104-248-29-142.sslip.io/api/v1/runs \
            -u "$ORCH_USER:$ORCH_PASS" \
            -H 'Content-Type: application/json' \
            -d "{\"level\":\"L4\",\"suite\":\"openvpn_performance\",\"target\":\"linux\",\"commit_sha\":\"${{ github.sha }}\",\"branch\":\"${{ github.ref_name }}\",\"status\":\"${STATUS}\",\"priority\":30}" || true
