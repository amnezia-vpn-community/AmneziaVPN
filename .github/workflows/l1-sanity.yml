name: L1 Sanity Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:  # manual trigger

jobs:
  l1-sanity:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Three most recent upstream AmneziaVPN releases. Keep in sync with
        # test-suites/src/amnezia_tests/versions.py::VERSIONS.
        version: ["4.8.15.4", "4.8.15.0", "4.8.14.5"]
        include:
          # SHA-256 of AmneziaVPN_Linux_Installer.bin (post-extraction from
          # the upstream linux_x64.tar). Empty string => SHA-256 test skips.
          # Only pin known-good hashes here; unknown versions skip the check.
          - version: "4.8.15.4"
            build_sha256: "a74f82c08f10d53b95697142d06053e0496e5508ea1ef50e72273ec818521737"
          - version: "4.8.15.0"
            build_sha256: ""
          - version: "4.8.14.5"
            build_sha256: ""

    name: l1-sanity (${{ matrix.version }})

    steps:
      # 1. Checkout test-suites (private repo)
      - name: Checkout test-suites
        uses: actions/checkout@v6
        with:
          repository: amnezia-vpn-community/test-suites
          token: ${{ secrets.GHCR_PAT }}
          path: test-suites

      # 2. Download AmneziaVPN binary for this matrix version
      - name: Download AmneziaVPN binary (${{ matrix.version }})
        env:
          AMNEZIA_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          URL="https://github.com/amnezia-vpn/amnezia-client/releases/download/${AMNEZIA_VERSION}/AmneziaVPN_${AMNEZIA_VERSION}_linux_x64.tar"
          echo "Downloading: $URL"
          wget -q -O AmneziaVPN_linux.tar "$URL"
          mkdir -p amnezia_bin
          tar xf AmneziaVPN_linux.tar -C amnezia_bin
          BIN=$(find amnezia_bin -name "*.bin" | head -1)
          chmod +x "$BIN"
          mv "$BIN" AmneziaVPN_Linux_Installer.bin
          echo "Binary: $(ls -lh AmneziaVPN_Linux_Installer.bin)"

      # 3. Log in to GHCR for linux-runner image
      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u amneziabot --password-stdin

      # 4. Run L1 tests via linux-runner Docker image
      - name: Run L1 sanity tests (${{ matrix.version }})
        env:
          AMNEZIA_TEST_VERSION: ${{ matrix.version }}
          # Empty string for unpinned versions => SHA-256 test cleanly skips.
          AMNEZIA_BUILD_SHA256: ${{ matrix.build_sha256 }}
        run: |
          docker run --rm \
            --privileged \
            -v "${{ github.workspace }}/test-suites:/workspace" \
            -v "${{ github.workspace }}/AmneziaVPN_Linux_Installer.bin:/workspace/AmneziaVPN_Linux_Installer.bin" \
            -e AMNEZIABIN=/workspace/AmneziaVPN_Linux_Installer.bin \
            -e AMNEZIA_TEST_VERSION="$AMNEZIA_TEST_VERSION" \
            -e AMNEZIA_BUILD_SHA256="$AMNEZIA_BUILD_SHA256" \
            -e DISPLAY=:99 \
            ghcr.io/amnezia-vpn-community/linux-runner:latest \
            bash -c "cd /workspace && pip install -e . -q && pytest src/amnezia_tests/suites/l1_sanity/ tests/ -v --junitxml=/workspace/results.xml --cov=amnezia_tests --cov-report=xml:/workspace/coverage.xml --cov-report=json:/workspace/coverage.json --tb=short"

      # 4b. Upload coverage.xml to DigitalOcean Spaces (canonical matrix entry only)
      #     The bucket key is fixed per suite, so only upload from one matrix
      #     job to avoid races/overwrites. Best-effort: never fail the build.
      - name: Upload coverage to DO Spaces
        if: always() && matrix.version == '4.8.15.4'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
          AWS_DEFAULT_REGION: fra1
        run: |
          set -euo pipefail
          if [ ! -f test-suites/coverage.xml ]; then
            echo "::warning::test-suites/coverage.xml not found — skipping upload"
            exit 0
          fi
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::warning::DO_SPACES_KEY/SECRET not configured — skipping upload"
            exit 0
          fi
          pip install --quiet awscli
          aws --endpoint-url https://fra1.digitaloceanspaces.com \
            s3 cp test-suites/coverage.xml \
            s3://amnezia-test-artifacts-fra1/coverage/l1/coverage.xml \
            --acl private

      # 5. Upload results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: l1-results-${{ matrix.version }}
          path: test-suites/results.xml

      # 5b. Upload coverage report to DO Spaces (best-effort)
      # Only run once per matrix (first version) to avoid clobbering.
      - name: Upload coverage report to DO Spaces
        if: always() && matrix.version == '4.8.15.4'
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
          AWS_DEFAULT_REGION: fra1
          SPACES_BUCKET: ${{ secrets.SPACES_BUCKET }}
        run: |
          set -euo pipefail
          if [ ! -f test-suites/coverage.xml ]; then
            echo "coverage.xml not produced — skipping upload"; exit 0
          fi
          DEST="s3://${SPACES_BUCKET}/artifacts/coverage/l1/${{ github.run_id }}/"
          aws s3 cp test-suites/coverage.xml "${DEST}coverage.xml" \
            --endpoint-url https://fra1.digitaloceanspaces.com
          if [ -f test-suites/coverage.json ]; then
            aws s3 cp test-suites/coverage.json "${DEST}coverage.json" \
              --endpoint-url https://fra1.digitaloceanspaces.com
          fi
          echo "Coverage uploaded: ${DEST}coverage.xml"

      - name: Upload coverage report as artifact
        if: always() && matrix.version == '4.8.15.4'
        uses: actions/upload-artifact@v7
        with:
          name: l1-coverage
          path: |
            test-suites/coverage.xml
            test-suites/coverage.json

      # 6. Parse test results for PR comment
      - name: Parse test results for PR comment
        if: always() && github.event_name == 'pull_request'
        run: |
          python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET, sys

          xml_path = 'test-suites/results.xml'
          suite_marker = 'l1-sanity'
          suite_name = 'L1 Sanity'
          version = '${{ matrix.version }}'

          try:
              tree = ET.parse(xml_path)
              root = tree.getroot()
              suites = list(root) if root.tag == 'testsuites' else [root]

              total = failures = errors = skipped = 0
              time_total = 0.0
              failed_tests = []

              for suite in suites:
                  total    += int(suite.get('tests',    0))
                  failures += int(suite.get('failures', 0))
                  errors   += int(suite.get('errors',   0))
                  skipped  += int(suite.get('skipped',  0))
                  time_total += float(suite.get('time', 0) or 0)
                  for tc in suite.findall('testcase'):
                      if tc.find('failure') is not None or tc.find('error') is not None:
                          failed_tests.append(
                              f"`{tc.get('classname', '')}::{tc.get('name', '')}`"
                          )

              passed = total - failures - errors - skipped
              total_failures = failures + errors
              status_emoji = '✅' if total_failures == 0 else '❌'

              lines = [
                  f'<!-- amnezia-test-results-{suite_marker}-{version} -->',
                  f'## {status_emoji} {suite_name} Results (v{version})',
                  '',
                  '| Metric | Value |',
                  '|--------|-------|',
                  f'| ✅ Passed | {passed} |',
                  f'| ❌ Failed | {total_failures} |',
                  f'| ⏭️ Skipped | {skipped} |',
                  f'| Total | {total} |',
                  f'| ⏱️ Duration | {time_total:.1f}s |',
              ]

              if failed_tests:
                  lines.append('')
                  lines.append('### Failed Tests')
                  for t in failed_tests[:20]:
                      lines.append(f'- {t}')
                  if len(failed_tests) > 20:
                      lines.append(f'- ... and {len(failed_tests) - 20} more')

              comment_body = '\n'.join(lines)
          except Exception as e:
              comment_body = (
                  f'<!-- amnezia-test-results-{suite_marker}-{version} -->\n'
                  f'⚠️ Could not parse test results for v{version}: {e}'
              )

          with open('/tmp/pr-comment.txt', 'w') as f:
              f.write(comment_body)

          print("PR comment prepared.")
          PYEOF

      # 7. Post test results comment on PR
      - name: Post test results comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = '${{ matrix.version }}';
            const marker = `<!-- amnezia-test-results-l1-sanity-${version} -->`;
            const body = fs.readFileSync('/tmp/pr-comment.txt', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
              console.log(`Updated existing comment ${existing.id}`);
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
              console.log(`Created new comment ${created.id}`);
            }

      # 8. Notify orchestrator (best-effort)
      - name: Notify orchestrator
        if: always()
        continue-on-error: true
        run: |
          STATUS=$([ "${{ job.status }}" = "success" ] && echo "passed" || echo "failed")
          curl -sf -X POST https://104-248-29-142.sslip.io/api/v1/runs \
            -u "$ORCH_USER:$ORCH_PASS" \
            -H 'Content-Type: application/json' \
            -d "{\"level\":\"L1\",\"suite\":\"build-sanity\",\"target\":\"linux\",\"commit_sha\":\"${{ github.sha }}\",\"branch\":\"${{ github.ref_name }}\",\"status\":\"${STATUS}\",\"priority\":10,\"metadata\":{\"amnezia_version\":\"${{ matrix.version }}\"}}" || true
        env:
          ORCH_USER: ${{ secrets.ORCH_ADMIN_USERNAME }}
          ORCH_PASS: ${{ secrets.ORCH_ADMIN_PASSWORD }}
