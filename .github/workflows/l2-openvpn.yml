name: L2 OpenVPN Integration Tests

# Phase: OpenVPN protocol coverage (L2 suite).
#
# Runs inside the linux-runner container which has openvpn + net-tools pre-installed.
# Requires NET_ADMIN capability and /dev/net/tun device for TUN interface creation.

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
    paths:
      - '.github/workflows/l2-openvpn.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l2-openvpn:
    name: L2 OpenVPN Integration Tests
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/amnezia-vpn-community/linux-runner:latest
      credentials:
        username: amneziabot
        password: ${{ secrets.GHCR_PAT }}
      options: "--cap-add NET_ADMIN --device /dev/net/tun"

    steps:
      # 1. Checkout AmneziaVPN fork
      - name: Checkout AmneziaVPN
        uses: actions/checkout@v4

      # 2. Checkout test-suites (private repo)
      - name: Checkout test-suites
        uses: actions/checkout@v4
        with:
          repository: amnezia-vpn-community/test-suites
          token: ${{ secrets.GHCR_PAT }}
          path: test-suites

      # 3. Install test dependencies
      - name: Install test dependencies
        run: |
          pip install -e ./test-suites -q

      # 4. Write OpenVPN client config from secret
      - name: Write OpenVPN client config
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /workspace/vpn-config
          echo "${{ secrets.OVPN_CONFIG_B64 }}" | base64 -d > /workspace/vpn-config/client.ovpn
          chmod 600 /workspace/vpn-config/client.ovpn
          echo "Config written: $(wc -l < /workspace/vpn-config/client.ovpn) lines"

      # 5. Install iptables (needed by openvpn for routing)
      - name: Install iptables
        run: |
          apt-get update -qq
          apt-get install -y -qq iptables iproute2 2>&1 | tail -5
          echo "iptables: $(iptables --version)"
          echo "openvpn: $(openvpn --version | head -1)"

      # 6. Run L2 OpenVPN tests
      - name: Run L2 OpenVPN tests
        shell: bash
        env:
          OVPN_CONFIG_B64: ${{ secrets.OVPN_CONFIG_B64 }}
        run: |
          set -euxo pipefail
          pytest ./test-suites/src/amnezia_tests/suites/l2_openvpn/ \
            -v \
            --junit-xml=openvpn-results.xml \
            --tb=short \
            --reruns 2 \
            --reruns-delay 3

      # 7. Upload test results as artifact
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2-openvpn-results
          path: openvpn-results.xml

      # 7b. Upload coverage report to DO Spaces (best-effort)
      - name: Upload coverage report to DO Spaces
        if: always()
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
          SPACES_BUCKET: ${{ secrets.SPACES_BUCKET }}
          GH_RUN_ID: ${{ github.run_id }}
          COVERAGE_SUITE: l2-openvpn
        run: |
          set -euo pipefail
          if [ ! -f coverage.xml ]; then
            echo "coverage.xml not produced — skipping upload"; exit 0
          fi
          python3 - <<'PYEOF'
          import os
          import boto3
          from botocore.client import Config
          bucket = os.environ['SPACES_BUCKET']
          run_id = os.environ['GH_RUN_ID']
          suite  = os.environ['COVERAGE_SUITE']
          session = boto3.session.Session()
          client = session.client('s3',
              region_name='fra1',
              endpoint_url='https://fra1.digitaloceanspaces.com',
              aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],
              config=Config(s3={'addressing_style': 'virtual'}),
          )
          prefix = f'artifacts/coverage/{suite}/{run_id}/'
          for fname in ('coverage.xml', 'coverage.json'):
              if os.path.exists(fname):
                  key = prefix + fname
                  ctype = 'application/xml' if fname.endswith('.xml') else 'application/json'
                  client.upload_file(fname, bucket, key, ExtraArgs={'ContentType': ctype})
                  print(f'Uploaded s3://{bucket}/{key}')
          PYEOF

      - name: Upload coverage report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2-openvpn-coverage
          path: |
            coverage.xml
            coverage.json

      # 8. Notify orchestrator (best-effort)
      - name: Notify orchestrator
        if: always()
        continue-on-error: true
        env:
          ORCH_USER: ${{ secrets.ORCH_ADMIN_USERNAME }}
          ORCH_PASS: ${{ secrets.ORCH_ADMIN_PASSWORD }}
        run: |
          STATUS=$([ "${{ job.status }}" = "success" ] && echo "passed" || echo "failed")
          curl -sf -X POST https://104-248-29-142.sslip.io/api/v1/runs \
            -u "$ORCH_USER:$ORCH_PASS" \
            -H 'Content-Type: application/json' \
            -d "{\"level\":\"L2\",\"suite\":\"openvpn\",\"target\":\"linux\",\"commit_sha\":\"${{ github.sha }}\",\"branch\":\"${{ github.ref_name }}\",\"status\":\"${STATUS}\",\"priority\":20}" || true
