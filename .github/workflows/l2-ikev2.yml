name: L2 IKEv2 Integration Tests

# Phase: IKEv2/IPsec protocol coverage (L2 suite).
#
# Runs inside the linux-runner container. StrongSwan is installed at runtime
# (no kernel module needed — IPsec is in-tree). NET_ADMIN + /dev/net/tun are
# required for charon to install XFRM policies and (when source-routing is
# enabled) to manage virtual-IP interfaces.

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
    paths:
      - '.github/workflows/l2-ikev2.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l2-ikev2:
    name: L2 IKEv2 Integration Tests
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/amnezia-vpn-community/linux-runner:latest
      credentials:
        username: amneziabot
        password: ${{ secrets.GHCR_PAT }}
      options: "--cap-add NET_ADMIN --device /dev/net/tun --privileged"

    steps:
      # 1. Checkout AmneziaVPN fork (for workflow metadata)
      - name: Checkout AmneziaVPN
        uses: actions/checkout@v4

      # 2. Checkout test-suites (private repo)
      - name: Checkout test-suites
        uses: actions/checkout@v4
        with:
          repository: amnezia-vpn-community/test-suites
          token: ${{ secrets.GHCR_PAT }}
          path: test-suites

      # 3. Install strongSwan + helper tools
      - name: Install strongSwan
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            strongswan \
            strongswan-pki \
            strongswan-starter \
            libcharon-extra-plugins \
            iptables iproute2 \
            iputils-ping dnsutils curl 2>&1 | tail -5
          echo "strongswan: $(ipsec --version | head -1 || ipsec version 2>&1 | head -1 || true)"
          echo "charon binary: $(command -v charon || command -v charon-systemd || echo not-found)"

      # 4. Install Python test dependencies
      - name: Install test dependencies
        run: |
          pip install -e ./test-suites -q

      # 5. Run L2 IKEv2 tests
      #
      # The tests' conftest writes /etc/ipsec.conf + /etc/ipsec.secrets from
      # the VPN_IKEV2_PSK secret and brings the tunnel up via `ipsec up`.
      # `ipsec start` (legacy starter) is used here because charon-systemd
      # is not available inside the container (no systemd).
      - name: Run L2 IKEv2 tests
        shell: bash
        env:
          VPN_IKEV2_PSK: ${{ secrets.VPN_IKEV2_PSK }}
          IKEV2_SERVER_IP: 164.90.212.148
        run: |
          set -euxo pipefail
          # Start the IPsec daemon (starter spawns charon)
          ipsec start || true
          sleep 2
          ipsec status || true

          pytest ./test-suites/src/amnezia_tests/suites/l2_ikev2/ \
            -v \
            --junit-xml=ikev2-results.xml \
            --tb=short \
            --reruns 2 \
            --reruns-delay 3

      # 6. Upload test results as artifact
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2-ikev2-results
          path: ikev2-results.xml

      # 7. Comment PR with result (best-effort)
      - name: Comment PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅ passed' : '❌ failed';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `**L2 IKEv2 Integration Tests:** ${status}\n\nArtifact: \`l2-ikev2-results\``,
            });

      # 8. Notify orchestrator (best-effort)
      - name: Notify orchestrator
        if: always()
        continue-on-error: true
        env:
          ORCH_USER: ${{ secrets.ORCH_ADMIN_USERNAME }}
          ORCH_PASS: ${{ secrets.ORCH_ADMIN_PASSWORD }}
        run: |
          STATUS=$([ "${{ job.status }}" = "success" ] && echo "passed" || echo "failed")
          curl -sf -X POST https://104-248-29-142.sslip.io/api/v1/runs \
            -u "$ORCH_USER:$ORCH_PASS" \
            -H 'Content-Type: application/json' \
            -d "{\"level\":\"L2\",\"suite\":\"ikev2\",\"target\":\"linux\",\"commit_sha\":\"${{ github.sha }}\",\"branch\":\"${{ github.ref_name }}\",\"status\":\"${STATUS}\",\"priority\":20}" || true
