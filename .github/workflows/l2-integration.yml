name: L2 Integration Tests

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:  # manual trigger

jobs:
  l2-integration:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    container:
      image: ghcr.io/amnezia-vpn-community/linux-runner:latest
      credentials:
        username: amneziabot
        password: ${{ secrets.GHCR_PAT }}
      options: "--cap-add NET_ADMIN --device /dev/net/tun"

    steps:
      # 1. Checkout AmneziaVPN fork
      - name: Checkout AmneziaVPN
        uses: actions/checkout@v4

      # 2. Checkout test-suites (private repo)
      - name: Checkout test-suites
        uses: actions/checkout@v4
        with:
          repository: amnezia-vpn-community/test-suites
          token: ${{ secrets.GHCR_PAT }}
          path: test-suites

      # 3. Install system dependencies for wg-quick
      - name: Install wg-quick dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq iptables iproute2 2>&1 | tail -5
          echo "iptables: $(iptables --version)"

      # 4. Download AmneziaVPN binary
      - name: Download AmneziaVPN binary
        run: |
          wget -q -O AmneziaVPN_linux.tar "https://github.com/amnezia-vpn/amnezia-client/releases/download/4.8.15.4/AmneziaVPN_4.8.15.4_linux_x64.tar"
          mkdir -p amnezia_bin
          tar xf AmneziaVPN_linux.tar -C amnezia_bin
          BIN=$(find amnezia_bin -name "*.bin" | head -1)
          chmod +x "$BIN"
          mv "$BIN" AmneziaVPN_Linux_Installer.bin
          echo "Binary: $(ls -lh AmneziaVPN_Linux_Installer.bin)"

      # 5. Install AmneziaVPN (--root requires absolute path for Qt IFW)
      - name: Install AmneziaVPN
        run: |
          chmod +x AmneziaVPN_Linux_Installer.bin
          ./AmneziaVPN_Linux_Installer.bin --root /opt/AmneziaVPN --accept-licenses --confirm-command install

      # 6. Write VPN config from secret
      - name: Write VPN config
        run: |
          mkdir -p /workspace/vpn-config
          echo "${{ secrets.WG_CLIENT_CONFIG_B64 }}" | base64 -d > /workspace/vpn-config/wg0-client.conf
          chmod 600 /workspace/vpn-config/wg0-client.conf
          # Remove DNS= directive: wg-quick calls resolvconf for DNS which requires
          # systemd/D-Bus — unavailable in GitHub Actions containers.
          sed -i '/^DNS\s*=/Id' /workspace/vpn-config/wg0-client.conf
          echo "VPN config written: $(wc -l < /workspace/vpn-config/wg0-client.conf) lines"

      # 7. Install test dependencies
      - name: Install test dependencies
        run: |
          pip install -e ./test-suites -q

      # 8. Run L2 integration tests
      - name: Run L2 integration tests
        env:
          VPN_CONFIG_PATH: /workspace/vpn-config/wg0-client.conf
        run: |
          pytest ./test-suites/src/amnezia_tests/suites/l2_integration/ \
            -v \
            --junit-xml=results.xml \
            --tb=short

      # 9. Upload results as artifact
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2-results
          path: results.xml

      # 10. Parse test results for PR comment
      - name: Parse test results for PR comment
        if: always() && github.event_name == 'pull_request'
        run: |
          python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET, sys

          xml_path = 'results.xml'
          suite_marker = 'l2-integration'
          suite_name = 'L2 Integration'

          try:
              tree = ET.parse(xml_path)
              root = tree.getroot()
              suites = list(root) if root.tag == 'testsuites' else [root]

              total = failures = errors = skipped = 0
              time_total = 0.0
              failed_tests = []

              for suite in suites:
                  total    += int(suite.get('tests',    0))
                  failures += int(suite.get('failures', 0))
                  errors   += int(suite.get('errors',   0))
                  skipped  += int(suite.get('skipped',  0))
                  time_total += float(suite.get('time', 0) or 0)
                  for tc in suite.findall('testcase'):
                      if tc.find('failure') is not None or tc.find('error') is not None:
                          failed_tests.append(
                              f"`{tc.get('classname', '')}::{tc.get('name', '')}`"
                          )

              passed = total - failures - errors - skipped
              total_failures = failures + errors
              status_emoji = '✅' if total_failures == 0 else '❌'

              lines = [
                  f'<!-- amnezia-test-results-{suite_marker} -->',
                  f'## {status_emoji} {suite_name} Results',
                  '',
                  '| Metric | Value |',
                  '|--------|-------|',
                  f'| ✅ Passed | {passed} |',
                  f'| ❌ Failed | {total_failures} |',
                  f'| ⏭️ Skipped | {skipped} |',
                  f'| Total | {total} |',
                  f'| ⏱️ Duration | {time_total:.1f}s |',
              ]

              if failed_tests:
                  lines.append('')
                  lines.append('### Failed Tests')
                  for t in failed_tests[:20]:
                      lines.append(f'- {t}')
                  if len(failed_tests) > 20:
                      lines.append(f'- ... and {len(failed_tests) - 20} more')

              comment_body = '\n'.join(lines)
          except Exception as e:
              comment_body = (
                  f'<!-- amnezia-test-results-{suite_marker} -->\n'
                  f'⚠️ Could not parse test results: {e}'
              )

          with open('/tmp/pr-comment.txt', 'w') as f:
              f.write(comment_body)

          print("PR comment prepared.")
          PYEOF

      # 11. Post test results comment on PR
      - name: Post test results comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- amnezia-test-results-l2-integration -->';
            const body = fs.readFileSync('/tmp/pr-comment.txt', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
              console.log(`Updated existing comment ${existing.id}`);
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
              console.log(`Created new comment ${created.id}`);
            }

      # 12. Notify orchestrator (best-effort)
      - name: Notify orchestrator
        if: always()
        continue-on-error: true
        run: |
          STATUS=$([ "${{ job.status }}" = "success" ] && echo "passed" || echo "failed")
          curl -sf -X POST https://104-248-29-142.sslip.io/api/v1/runs \
            -u "$ORCH_USER:$ORCH_PASS" \
            -H 'Content-Type: application/json' \
            -d "{\"level\":\"L2\",\"suite\":\"integration\",\"target\":\"linux\",\"commit_sha\":\"${{ github.sha }}\",\"branch\":\"${{ github.ref_name }}\",\"status\":\"${STATUS}\",\"priority\":20}" || true
        env:
          ORCH_USER: ${{ secrets.ORCH_ADMIN_USERNAME }}
          ORCH_PASS: ${{ secrets.ORCH_ADMIN_PASSWORD }}
