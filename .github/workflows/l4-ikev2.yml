name: L4 IKEv2 Performance Tests

# Phase 8: protocol expansion of L4 perf suite (throughput + latency) to IKEv2/IPsec.
#
# Same container & infra as L2 IKEv2 — strongSwan installed at runtime
# (not in the base image to keep linux-runner small). Needs NET_ADMIN +
# /dev/net/tun + privileged for charon to install XFRM policies and
# manage virtual-IP interfaces.

on:
  workflow_dispatch:
  schedule:
    # Weekly, 1 hour after the WG L4 run (Sundays 04:00 UTC).
    - cron: '0 4 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l4-ikev2:
    name: L4 IKEv2 Performance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    container:
      image: ghcr.io/amnezia-vpn-community/linux-runner:latest
      credentials:
        username: amneziabot
        password: ${{ secrets.GHCR_PAT }}
      options: "--cap-add NET_ADMIN --device /dev/net/tun --privileged"

    steps:
      - name: Checkout AmneziaVPN
        uses: actions/checkout@v4

      - name: Checkout test-suites
        uses: actions/checkout@v4
        with:
          repository: amnezia-vpn-community/test-suites
          token: ${{ secrets.GHCR_PAT }}
          path: test-suites

      - name: Install strongSwan
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            strongswan strongswan-pki strongswan-starter \
            libcharon-extra-plugins iptables iproute2 \
            iputils-ping 2>&1 | tail -3
          echo "strongswan: $(ipsec --version 2>&1 | head -1 || true)"

      - name: Install test dependencies
        run: pip install -e ./test-suites -q

      - name: Configure verbose charon logging
        shell: bash
        run: |
          mkdir -p /etc/strongswan.d
          cat > /etc/strongswan.d/charon-logging.conf <<'CFG'
          charon {
              filelog {
                  charon {
                      path = /var/log/charon.log
                      time_format = %b %e %T
                      ike_name = yes
                      append = no
                      default = 2
                      flush_line = yes
                  }
              }
              cisco_unity = yes
          }
          CFG
          ipsec start || true
          sleep 3
          ipsec status || true

      - name: Run L4 IKEv2 performance tests
        shell: bash
        env:
          VPN_IKEV2_PSK: ${{ secrets.VPN_IKEV2_PSK }}
          IKEV2_SERVER_IP: 164.90.212.148
          IKEV2_IPERF_TARGET: 10.8.0.1
        run: |
          set -euxo pipefail
          pytest ./test-suites/src/amnezia_tests/suites/l4_performance/test_ikev2_performance.py \
            -v -s \
            --junit-xml=l4-ikev2-results.xml \
            --tb=short \
            --reruns 1 \
            --reruns-delay 5

      - name: Dump charon log on failure
        if: failure()
        continue-on-error: true
        run: |
          [ -f /var/log/charon.log ] && tail -200 /var/log/charon.log || echo '(no charon.log)'
          ipsec statusall || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l4-ikev2-results
          path: l4-ikev2-results.xml

      - name: Notify orchestrator
        if: always()
        continue-on-error: true
        env:
          ORCH_USER: ${{ secrets.ORCH_ADMIN_USERNAME }}
          ORCH_PASS: ${{ secrets.ORCH_ADMIN_PASSWORD }}
        run: |
          STATUS=$([ "${{ job.status }}" = "success" ] && echo "passed" || echo "failed")
          curl -sf -X POST https://104-248-29-142.sslip.io/api/v1/runs \
            -u "$ORCH_USER:$ORCH_PASS" \
            -H 'Content-Type: application/json' \
            -d "{\"level\":\"L4\",\"suite\":\"ikev2_performance\",\"target\":\"linux\",\"commit_sha\":\"${{ github.sha }}\",\"branch\":\"${{ github.ref_name }}\",\"status\":\"${STATUS}\",\"priority\":30}" || true
